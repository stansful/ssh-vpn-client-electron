# Releases Shadow from master. Every push to master runs the whole CI (ci.yml through workflow_call; ci.yml skips
# its own run of that push, so the checks run once). When the version in package.json has no release yet, the eight
# files are built with scripts/build-release.sh (what a local build runs) and published as release X.Y.Z: a plain
# tag, no "v", on the built commit, which the in-app updater reads via /releases/latest; a draft first, every upload
# checked, then published as the latest release. A version that is released already ends the run with a notice:
# bump it with scripts/make-release.sh, which commits "feat: release - version X.Y.Z". Nothing is built or published
# from a commit whose checks fail; re-run the failed jobs, or push a fix (the version is still unreleased).
name: Release

on:
  # Releases come from master only; ci.yml checks pushes to the other branches. The gate also checks that master is
  # the default branch.
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# The next run's gate starts only after this one has published. A newer pending run replaces an older pending
# one; a running release is never cancelled, since that can leave a draft behind.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  # Exact names src/core/update/github-app-update.ts looks for, after "shadow-ssh-<version>-":
  # scripts/build-release.sh builds exactly these (ASSET_SUFFIXES there; tests/release-assets.test.ts).
  ASSET_SUFFIXES: >-
    windows-portable-x64.exe windows-portable-arm64.exe
    macos-dmg-x64.dmg macos-dmg-arm64.dmg
    linux-portable-x86_64.AppImage linux-portable-arm64.AppImage
    linux-package-amd64.deb linux-package-arm64.deb

jobs:
  gate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.gate.outputs.version }}
      should_release: ${{ steps.gate.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /package.json
            /scripts/lib/version.sh
            /scripts/lib/package-version.mjs
            /.github/scripts/
          sparse-checkout-cone-mode: false

      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node scripts/lib/package-version.mjs get)
          export VERSION
          state=$(bash .github/scripts/release-state.sh)
          case $state in
            released)
              echo "::notice title=Релиз пропущен::Версия $VERSION уже выпущена. Чтобы выпустить новую, поднимите версию через scripts/make-release.sh (коммит «feat: release - version X.Y.Z») и запушьте коммит."
              should_release=false
              ;;
            retry)
              echo "::notice::Тег $VERSION уже стоит на этом коммите, а релиза нет: публикую его."
              should_release=true
              ;;
            *) should_release=true ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"

  # Every push to master, released or not, gets the whole CI here (ci.yml itself ignores pushes to master). It runs
  # even when the gate refused the version, so the push is still checked.
  quality:
    needs: gate
    if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      release: true

  build:
    needs: [gate, quality]
    if: needs.gate.outputs.should_release == 'true'
    # DMG and hdiutil exist only on macOS; electron-builder cross-builds the
    # Windows and Linux packages here without wine.
    runs-on: macos-26
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The owner's local Node (bundles npm 11.6.2). Newer npm rejects lockfiles
      # 11.6.2 writes ("Missing: @emnapi/core from lock file"), so keep the two
      # in step when upgrading Node locally.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
          cache: npm

      # Not go-version-file: go.mod's toolchain line resolves to 1.24.x, while
      # the committed service binaries are built with 1.25.
      # No cache: build-native-service.mjs sets its own GOCACHE.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false

      # Only the Electron zips (~780 MB): @electron/get re-checks them against a
      # freshly downloaded SHASUMS256.txt. Toolsets and GOCACHE hold executables
      # that are never re-verified, so a poisoned build would persist in them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/electron
          key: electron-zips-${{ hashFiles('package-lock.json') }}

      - run: npm ci --no-audit --no-fund

      - name: Prepare packaging tools
        run: |
          # fpm compresses .deb payloads with xz from PATH; nothing bundles it.
          command -v xz >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install xz
          # The zstd-19 AppImage wrapper only engages when this toolset is
          # already cached; otherwise the first (x64) AppImage is ~10 MB larger.
          ELECTRON_BUILDER_CACHE="$PWD/.cache/electron-builder" node -e '
            const v = require("./package.json").build.toolsets.appimage;
            require("app-builder-lib/out/toolsets/linux.js").getAppImageTools(v, 1).then((t) => console.log(t.mksquashfs));
          '
          # Spotlight indexing contributes to hdiutil "Resource busy" failures.
          sudo mdutil -a -i off >/dev/null || true

      # wintun.dll (gitignored; Windows packaging refuses to run without it) fetched and checked against the SHA-256
      # the helper pins: the quality job has no DLLs, so its go test skips that check. Then npm run build:prod
      # without GH_TOKEN (electron-builder's implicit "publish on CI" uploads nothing) and without a signing
      # identity, a second pass for macOS and Linux when hdiutil fails, exactly the eight files, each within the
      # updater's 160 MiB, and their sizes and sums in the log.
      - name: Build (scripts/build-release.sh)
        run: scripts/build-release.sh

      - name: Check the assets
        run: |
          if [ "$(node scripts/lib/package-version.mjs get)" != "$VERSION" ]; then
            echo "::error file=package.json::package.json is not $VERSION."
            exit 1
          fi
          expected=$(for suffix in $ASSET_SUFFIXES; do echo "shadow-ssh-$VERSION-$suffix"; done | LC_ALL=C sort)
          actual=$(find release -mindepth 1 -maxdepth 1 -exec basename {} \; | LC_ALL=C sort)
          if [ "$expected" != "$actual" ]; then
            echo "::error::release/ holds ${actual//$'\n'/ }, not ${expected//$'\n'/ }."
            exit 1
          fi
          df -h .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.gate.outputs.version }}
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # A separate job, so the write token never shares a machine with npm install
  # scripts or downloaded build tools, and a failed upload can be re-run
  # without rebuilding.
  publish:
    needs: [gate, quality, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # Full history and tags for the notes, without the 400 MB tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            /package.json
            /scripts/lib/version.sh
            /scripts/lib/package-version.mjs
            /.github/scripts/
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.gate.outputs.version }}
          path: release

      # Russian first, then English: which file is for which system, and the commits since the previous release tag
      - name: Write release notes
        run: |
          bash .github/scripts/release-notes.sh > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish ${{ needs.gate.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fresh state, not the gate's: this job may be a re-run days later.
          state=$(bash .github/scripts/release-state.sh)
          if [ "$state" = released ]; then
            echo "::error::$VERSION has already been released by another run."
            exit 1
          fi

          # GITHUB_TOKEN cannot create a tag on a commit whose workflow files differ from the default branch's;
          # the newer run of the default branch releases instead.
          git fetch --quiet --no-tags origin "$DEFAULT_BRANCH"
          if [ "$(git rev-parse "$GITHUB_SHA:.github/workflows")" != "$(git rev-parse FETCH_HEAD:.github/workflows)" ]; then
            echo "::error::.github/workflows changed on $DEFAULT_BRANCH after this commit; the newer run of $DEFAULT_BRANCH will release $VERSION."
            exit 1
          fi

          assets=()
          for suffix in $ASSET_SUFFIXES; do
            assets+=("release/shadow-ssh-$VERSION-$suffix")
          done

          # Drafts have no tag yet: any draft of this version is a leftover of a killed run. The release list
          # lags behind (a draft created a second ago is often missing from it), so it only serves this clean-up.
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.draft and .tag_name == env.VERSION) | .id' \
            | while read -r old; do gh api -X DELETE "repos/$GH_REPO/releases/$old" --silent; done

          # Draft first: the updater only sees the release once every asset is uploaded and checked. GitHub
          # creates the lightweight tag on publish. The API returns the draft's id at once, and everything below
          # works with that id, never with a lookup in the release list.
          id=$(gh api -X POST "repos/$GH_REPO/releases" \
            -f tag_name="$VERSION" -f target_commitish="$GITHUB_SHA" \
            -f name="ssh-vpn-client-electron-$VERSION-release" -F body=@"$RUNNER_TEMP/notes.md" \
            -F draft=true --jq .id)
          if ! [[ $id =~ ^[0-9]+$ ]]; then
            echo "::error::Creating the draft for $VERSION returned no release id: $id"
            exit 1
          fi
          # Only ever a draft: a PATCH that published the release and then lost its answer must not delete it
          trap '[ -n "${published:-}" ] || [ "$(gh api "repos/$GH_REPO/releases/$id" --jq .draft 2>/dev/null)" != true ] ||
            gh api -X DELETE "repos/$GH_REPO/releases/$id" --silent || true' EXIT

          # Three tries per file, as the gh CLI's uploader made them: a 5xx or a dropped connection on one of ~1 GB of
          # uploads should not cost the run. A half-made asset of a failed try is deleted before the next one; an
          # upload slower than 100 KB/s for two minutes counts as failed rather than hanging until the timeout.
          for f in "${assets[@]}"; do
            name=$(basename "$f")
            for try in 1 2 3; do
              if curl -sS --fail-with-body --connect-timeout 30 --speed-limit 102400 --speed-time 120 -X POST \
                -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/octet-stream" --data-binary "@$f" \
                "https://uploads.github.com/repos/$GH_REPO/releases/$id/assets?name=$name" > "$RUNNER_TEMP/upload.json"; then
                continue 2
              fi
              echo "::warning::Upload $try of $name failed: $(head -c 500 "$RUNNER_TEMP/upload.json")"
              gh api "repos/$GH_REPO/releases/$id" --jq ".assets[] | select(.name == \"$name\") | .id" \
                | while read -r asset; do gh api -X DELETE "repos/$GH_REPO/releases/assets/$asset" --silent || true; done \
                || true
              [ "$try" = 3 ] || sleep 10
            done
            echo "::error::$name could not be uploaded."
            exit 1
          done

          # The draft by id; its asset list may also lag a moment behind the uploads
          for _ in 1 2 3 4 5 6; do
            gh api "repos/$GH_REPO/releases/$id" \
              --jq '.assets[] | "\(.name) \(.size) \(.state) \(.digest // "-")"' > "$RUNNER_TEMP/uploaded.txt"
            [ "$(wc -l < "$RUNNER_TEMP/uploaded.txt")" -ne "${#assets[@]}" ] || break
            sleep 5
          done
          if [ "$(wc -l < "$RUNNER_TEMP/uploaded.txt")" -ne "${#assets[@]}" ]; then
            echo "::error::The draft has $(wc -l < "$RUNNER_TEMP/uploaded.txt") assets instead of ${#assets[@]}."
            exit 1
          fi
          for f in "${assets[@]}"; do
            name=$(basename "$f")
            size="" asset_state="" digest=""
            read -r _ size asset_state digest < <(awk -v n="$name" '$1 == n' "$RUNNER_TEMP/uploaded.txt") || true
            if [ "$size" != "$(wc -c < "$f" | tr -d ' ')" ] || [ "$asset_state" != uploaded ]; then
              echo "::error::$name on the draft does not match the built file (size ${size:-?}, state ${asset_state:-?})."
              exit 1
            fi
            if [ "$digest" = "-" ]; then
              echo "::warning::GitHub reported no digest for $name."
            elif [ "$digest" != "sha256:$(sha256sum "$f" | cut -d' ' -f1)" ]; then
              echo "::error::$name on the draft has digest $digest, which differs from the built file."
              exit 1
            fi
          done

          gh api -X PATCH "repos/$GH_REPO/releases/$id" -F draft=false -f make_latest=true --silent
          published=1

          latest=""
          for _ in 1 2 3 4 5 6; do
            latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name || true)
            [ "$latest" = "$VERSION" ] && break
            sleep 5
          done
          if [ "$latest" != "$VERSION" ]; then
            echo "::error::$VERSION is published, but /releases/latest returns \"$latest\". Check the release before re-running anything."
            exit 1
          fi
          # The tag's commit as release-state.sh reads it: an annotated tag (one made by hand, which
          # release-state.sh accepts as retry) is followed to its commit
          . scripts/lib/version.sh
          refs=""
          for _ in 1 2 3; do
            refs=$(git ls-remote --tags origin) && break
            sleep 5
          done
          tag_sha=$(tag_commit "$VERSION" <<<"$refs")
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::$VERSION is published, but its tag points at ${tag_sha:-nothing (or the tags could not be read)}, not $GITHUB_SHA."
            exit 1
          fi
          echo "Released $VERSION: https://github.com/$GH_REPO/releases/tag/$VERSION"
